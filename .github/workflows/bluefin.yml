name: Bluefin

on:
  push:
    branches: [ "main" ]
  pull_request:
    branches: [ "main" ]

env:
  CARGO_TERM_COLOR: always

jobs:
  build:
    runs-on: ${{ matrix.os }}
    strategy:
      matrix:
        os: [ ubuntu-latest, macos-latest ]
        include:
          - os: ubuntu-latest
            target: Linux

          - os: macos-latest
            target: Macos

    steps:
      - uses: actions/checkout@v3
      - name: Cache cargo
        # Caches ~/.cargo/registry, ~/.cargo/git, and target/ keyed on
        # Cargo.lock + rustc version + OS. The bench job already uses this;
        # adding it to build deduplicates registry downloads, git deps, and
        # proc-macro / build-script compilation across all build matrix
        # entries. Profiles still differ (build = debug, bench = release),
        # so the two jobs don't share built artefacts; this only saves the
        # shared front-end work.
        uses: Swatinem/rust-cache@v2
      - name: Build
        run: cargo build --verbose
      - name: Run tests
        run: cargo test --verbose
      - name: Build w/ macos-fast
        if: runner.os == 'macOS'
        run: cargo build --verbose --features macos-fast
      - name: Run test w/ macos-fast
        if: runner.os == 'macOS'
        run: cargo test --verbose --features macos-fast

  coverage:
    runs-on: ubuntu-latest
    env:
      CARGO_TERM_COLOR: always
    steps:
      - uses: actions/checkout@v4
      - name: Install Rust
        run: rustup update stable
      - name: Install cargo-llvm-cov
        uses: taiki-e/install-action@cargo-llvm-cov
      - name: Generate code coverage
        run: cargo llvm-cov --all-features --workspace --lcov --ignore-filename-regex "error.rs" --output-path lcov.info
      - name: Upload coverage to Codecov
        uses: codecov/codecov-action@v3
        with:
          token: ${{ secrets.CODECOV_TOKEN }} # not required for public repos
          files: lcov.info
          fail_ci_if_error: false

  kani:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
    steps:
      - name: Checkout bluefin
        uses: actions/checkout@v4
      - name: Run Kani
        uses: model-checking/kani-github-action@v1.1

  bench:
    # Throughput regression gate. Runs the two-process loopback bench
    # (server + N client procs, each with its own tokio runtime) 5 times
    # at N=2 connections, parses per-conn FINAL lines, and asserts the
    # aggregate stats clear the floors below.
    #
    # >>> RUNNER REALITY <<<
    # Hosted macos-latest runners are dramatically slower and burstier than
    # typical Apple-silicon dev hardware. The bench gate compensates with
    # FOUR CI-only env-var overrides (production binaries are unaffected
    # unless these env vars are explicitly set):
    #
    #   1. BLUEFIN_NUM_SENDS=500000 shrinks the per-conn payload from
    #      15 GB (10 M sends) to 750 MB. Hosted runners can't sustain the
    #      throughput needed to deliver 15 GB inside any reasonable
    #      timeout window.
    #
    #   2. BLUEFIN_RECV_IDLE_TIMEOUT_SECS=10 extends the server's
    #      "peer-is-gone" deadline from the default 2 s to 10 s. Without
    #      this bump, conns that are progressing slowly on a contended
    #      runner get TRUNCated mid-flight and the gate becomes meaningless.
    #
    #   3. BLUEFIN_SOCKET_RCVBUF / SNDBUF=8388608 raises per-socket buffers
    #      from the hardcoded 512 KiB default to 8 MiB. 512 KiB drains in
    #      ~340 us at burst rate; tokio scheduling gaps on contended 3-vCPU
    #      runners routinely exceed that, dropping packets. 8 MiB buys
    #      ~5 ms of preemption tolerance and is the practical macOS ceiling
    #      (kern.ipc.maxsockbuf clamps at ~8 MiB on hosted runners).
    #
    #   4. "max_peak" is still vulnerable to kernel-buffer-drain artifacts
    #      on starved conns (a recovering preempted task drains the kernel
    #      UDP buffer at memcpy speed and reports 100+ GB/s inst readings).
    #      bench_ci.sh filters BOTH mean_avg AND max_peak to GOOD conns
    #      only (those that delivered >= GOOD_CONN_MIN_BYTES) to keep the
    #      gate meaningful.
    #
    # With this stack, "good conn" means "delivered the full 750 MB CI
    # payload" again. The good_conns floor (6/10) is now a real liveness
    # gate, not a smoke test: a sub-50 % completion rate signals real
    # degradation. mean_avg and max_peak floors still detect throughput
    # regressions on the GOOD-conn population. See skills/bluefin-ci/SKILL.md.
    #
    # Current floors are pegged at ~50 % of observed CI medians (the
    # noise + variance margin) rather than at the local-dev numbers.
    # If CI flakes:
    #   - lower BLUEFIN_BENCH_FLOOR_MAX_PEAK_GBPS in 0.20 steps;
    #   - if mean_avg trips, you likely have a real regression -- investigate
    #     before lowering it further;
    #   - if good_conns trips at 6, look at the per-run table. Either
    #     the runner had a uniquely bad allocation (re-run) or fewer than
    #     6/10 conns delivered the 700 MB payload (real regression or
    #     a runner-image change worth investigating).
    #
    # >>> RATCHET INSTRUCTIONS <<<
    # After 5-10 successful CI runs, raise floors based on the OBSERVED CI
    # numbers (not local dev):
    #   1. Open the most recent green `bench (macos-latest)` run logs.
    #   2. Compute the median of "max peak gb/s (good only)" across runs.
    #   3. Set BLUEFIN_BENCH_FLOOR_MAX_PEAK_GBPS to ~0.50 * that median.
    #   4. Compute the median of "mean avg gb/s (good only)" across runs.
    #      Set BLUEFIN_BENCH_FLOOR_MEAN_AVG_GBPS to ~0.50 * that median.
    #   5. For good_conns: take the LOWEST observation across runs, then
    #      drop one for headroom (e.g. observed lows of 7,8,8 -> floor 6).
    runs-on: ${{ matrix.os }}
    strategy:
      # Matrix-of-one for two reasons:
      #   1. The displayed job name becomes `bench (macos-latest)`, which
      #      matches the `build (macos-latest)` / `build (ubuntu-latest)`
      #      naming the build job already produces.
      #   2. Future expansion to additional runner OSes (e.g. once Linux
      #      hosted runners gain enough rmem_max headroom for the bench
      #      to be meaningful, see skills/bluefin-ci/SKILL.md) is a
      #      one-line change here.
      matrix:
        os: [ macos-latest ]
    # `pull-requests: write` is required so the sticky-comment step can
    # post / update the bench-results comment on the PR. `contents: read`
    # is the implicit default for `actions/checkout`.
    permissions:
      contents: read
      pull-requests: write
    env:
      # Pegged at the observed CI floor with the new env-var stack
      # (bigger SO_RCVBUF, longer recv-idle timeout, smaller payload).
      # See block comment above for the rationale.
      BLUEFIN_BENCH_FLOOR_MEAN_AVG_GBPS:    "0.40"      # ~50 % of first observed CI median (0.92 GB/s @ 5 runs)
      BLUEFIN_BENCH_FLOOR_MAX_PEAK_GBPS:    "2.00"      # ~50 % of first observed CI median (4.15 GB/s @ 5 runs)
      BLUEFIN_BENCH_FLOOR_GOOD_CONNS:       "6"         # ≥6 of 10 conn-trials completed the (shrunk) payload; held at 6 (not 9) for runner-allocation headroom
      BLUEFIN_BENCH_GOOD_CONN_MIN_BYTES:    "700000000" # 700 MB ≈ 93 % of the 750 MB CI payload (BLUEFIN_NUM_SENDS=500000 × 1500)
      BLUEFIN_BENCH_SUMMARY_MD:             "bench_logs/ci_summary.md"
      # Bump per-socket SO_RCVBUF / SO_SNDBUF from the hardcoded 512 KB
      # default to 8 MB for CI only. 512 KB drains in ~340 µs at 1.5 GB/s,
      # well below tokio's scheduling-gap durations on contended runners,
      # which is why CI sees so many starved conns. 8 MB buys ~5 ms of
      # recv-task preemption tolerance — enough to absorb the typical
      # contention bursts on hosted macos-latest. macOS clamps to
      # kern.ipc.maxsockbuf (default ~8 MB on hosted runners), so 8 MB is
      # the practical ceiling without sysctl tweaks. Production traffic
      # is unaffected: the env vars are unset there and the code falls
      # back to the historical 512 KB.
      BLUEFIN_SOCKET_RCVBUF:                "8388608"   # 8 MiB
      BLUEFIN_SOCKET_SNDBUF:                "8388608"   # 8 MiB
      # Shrink the per-conn payload from 15 GB (10 M sends) to 750 MB
      # (500 K sends) AND extend the server's recv-idle timeout from 2 s
      # to 10 s. Together these let conns COMPLETE the payload on hosted
      # runners instead of TRUNCing at the timeout. Reframes "good conn"
      # back to its original semantic ("delivered the full payload") and
      # makes BLUEFIN_BENCH_FLOOR_GOOD_CONNS a real liveness gate at 6/10.
      # Production binaries built without these env vars are unaffected.
      BLUEFIN_NUM_SENDS:                    "500000"    # 500 K × 1500 B = 750 MB per conn
      BLUEFIN_RECV_IDLE_TIMEOUT_SECS:       "10"        # 5× the dev default; conns finish naturally
    steps:
      - uses: actions/checkout@v4
      - name: Install Rust
        run: rustup update stable
      - name: Cache cargo
        uses: Swatinem/rust-cache@v2
      - name: Build release binaries
        run: cargo build --release --bin server --bin client
      - name: Run CI bench (5 runs x 2 conns)
        id: bench
        # Don't fail the step here — we want the comment + step-summary to
        # post even on regression. We re-export the rc and fail at the end.
        run: |
          set +e
          ./bench_ci.sh -r 5 -n 2 --skip-build
          echo "rc=$?" >> "$GITHUB_OUTPUT"
      - name: Append summary to GitHub step summary
        if: always()
        run: |
          if [[ -s "$BLUEFIN_BENCH_SUMMARY_MD" ]]; then
            cat "$BLUEFIN_BENCH_SUMMARY_MD" >> "$GITHUB_STEP_SUMMARY"
          else
            echo "## Bluefin throughput bench :warning: no summary produced" >> "$GITHUB_STEP_SUMMARY"
          fi
      - name: Post / update PR comment
        if: always() && github.event_name == 'pull_request'
        uses: marocchino/sticky-pull-request-comment@v2
        with:
          # `header` keys the sticky comment so subsequent runs UPDATE the
          # same comment instead of spamming the PR.
          header: bluefin-bench
          path: ${{ env.BLUEFIN_BENCH_SUMMARY_MD }}
      - name: Upload bench logs
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: bench-logs
          path: bench_logs/
          retention-days: 14
      - name: Fail job on regression
        if: always()
        run: |
          rc="${{ steps.bench.outputs.rc }}"
          echo "bench_ci.sh exit code: $rc"
          exit "${rc:-1}"
