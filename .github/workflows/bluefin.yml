name: Bluefin

on:
  push:
    branches: [ "main" ]
  pull_request:
    branches: [ "main" ]

env:
  CARGO_TERM_COLOR: always

jobs:
  build:
    runs-on: ${{ matrix.os }}
    strategy:
      matrix:
        os: [ ubuntu-latest, macos-latest ]
        include:
          - os: ubuntu-latest
            target: Linux

          - os: macos-latest
            target: Macos

    steps:
      - uses: actions/checkout@v3
      - name: Build
        run: cargo build --verbose
      - name: Run tests
        run: cargo test --verbose
      - name: Build w/ macos-fast
        if: runner.os == 'macOS'
        run: cargo build --verbose --features macos-fast
      - name: Run test w/ macos-fast
        if: runner.os == 'macOS'
        run: cargo test --verbose --features macos-fast

  coverage:
    runs-on: ubuntu-latest
    env:
      CARGO_TERM_COLOR: always
    steps:
      - uses: actions/checkout@v4
      - name: Install Rust
        run: rustup update stable
      - name: Install cargo-llvm-cov
        uses: taiki-e/install-action@cargo-llvm-cov
      - name: Generate code coverage
        run: cargo llvm-cov --all-features --workspace --lcov --ignore-filename-regex "error.rs" --output-path lcov.info
      - name: Upload coverage to Codecov
        uses: codecov/codecov-action@v3
        with:
          token: ${{ secrets.CODECOV_TOKEN }} # not required for public repos
          files: lcov.info
          fail_ci_if_error: false

  kani:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
    steps:
      - name: Checkout bluefin
        uses: actions/checkout@v4
      - name: Run Kani
        uses: model-checking/kani-github-action@v1.1

  bench-macos:
    # Throughput regression gate. Runs the two-process loopback bench
    # (server + N client procs, each with its own tokio runtime) 5 times
    # at N=2 connections, parses per-conn FINAL lines, and asserts the
    # aggregate stats clear the floors below.
    #
    # >>> RUNNER REALITY <<<
    # Hosted macos-latest runners are dramatically slower and burstier than
    # typical Apple-silicon dev hardware. Two artefacts dominate the
    # measurement:
    #
    #   1. Bilateral failure is the steady state. Per the 2026-05-11 CI
    #      runs, ~50–100 % of conn-trials are starved (deliver <60 MB
    #      before the server's 2 s recv-idle timeout fires). Active conns
    #      deliver 300–800 MB. Run-to-run variance is high; a single CI
    #      run can swing between 5/10 and 1/10 good conns purely from
    #      runner allocation luck.
    #
    #   2. "max_peak" is corrupted by kernel-buffer-drain artifacts on
    #      starved conns. When the server task is preempted for tens of ms
    #      under CPU contention, packets queue in the kernel UDP buffer.
    #      When the task resumes, it drains the buffer at memcpy speed and
    #      records inst-throughput readings of 100+ GB/s — which is
    #      kernel-to-userspace memcpy rate, not network rate. bench_ci.sh
    #      filters max_peak to GOOD conns only (those that delivered
    #      >= GOOD_CONN_MIN_BYTES) to keep the gate meaningful.
    #
    # That makes the gate effectively a SMOKE TEST on hosted CI: it catches
    # "code panics", "everything is broken", "burst rate collapsed". It
    # CANNOT reliably catch a 30 % throughput regression — that signal
    # lives in local sweeps, not here. See skills/bluefin-ci/SKILL.md.
    #
    # Current floors are pegged at the lower bound of observed CI runs,
    # NOT local dev. If CI flakes:
    #   - lower BLUEFIN_BENCH_FLOOR_MAX_PEAK_GBPS in 0.20 steps;
    #   - if mean_avg trips, you have a real regression — investigate
    #     before lowering it further;
    #   - if good_conns trips at 1, look at the per-run table. Either
    #     the runner had a uniquely bad allocation (re-run) or no conn
    #     anywhere delivered 100 MB (real regression).
    #
    # >>> RATCHET INSTRUCTIONS <<<
    # After 5–10 successful CI runs, raise floors based on the OBSERVED CI
    # numbers (not local dev):
    #   1. Open the most recent green `bench-macos` run logs.
    #   2. Compute the median of "max peak gb/s (good only)" across runs.
    #   3. Set BLUEFIN_BENCH_FLOOR_MAX_PEAK_GBPS to ~0.50 * that median.
    #   4. Leave mean_avg at 0.05 unless the CI median has demonstrably
    #      risen.
    #   5. For good_conns: count how many conn-trials cleared
    #      BLUEFIN_BENCH_GOOD_CONN_MIN_BYTES across the recent runs, take
    #      the LOWEST observation across runs, then drop one for headroom.
    runs-on: macos-latest
    # `pull-requests: write` is required so the sticky-comment step can
    # post / update the bench-results comment on the PR. `contents: read`
    # is the implicit default for `actions/checkout`.
    permissions:
      contents: read
      pull-requests: write
    env:
      # Pegged at ~50 % of the observed CI median, NOT local dev. See block
      # comment above for the rationale.
      BLUEFIN_BENCH_FLOOR_MEAN_AVG_GBPS:    "0.05"      # noise floor (just non-zero)
      BLUEFIN_BENCH_FLOOR_MAX_PEAK_GBPS:    "1.00"      # ~50 % of CI-median GOOD-conn peak (~2.40)
      BLUEFIN_BENCH_FLOOR_GOOD_CONNS:       "1"         # smoke test: ≥1 of 10 conn-trials made real progress; runner variance dominates
      BLUEFIN_BENCH_GOOD_CONN_MIN_BYTES:    "100000000" # 100 MB: separates "made real progress" from "starved" on hosted runners
      BLUEFIN_BENCH_SUMMARY_MD:             "bench_logs/ci_summary.md"
      # Bump per-socket SO_RCVBUF / SO_SNDBUF from the hardcoded 512 KB
      # default to 8 MB for CI only. 512 KB drains in ~340 µs at 1.5 GB/s,
      # well below tokio's scheduling-gap durations on contended runners,
      # which is why CI sees so many starved conns. 8 MB buys ~5 ms of
      # recv-task preemption tolerance — enough to absorb the typical
      # contention bursts on hosted macos-latest. macOS clamps to
      # kern.ipc.maxsockbuf (default ~8 MB on hosted runners), so 8 MB is
      # the practical ceiling without sysctl tweaks. Production traffic
      # is unaffected: the env vars are unset there and the code falls
      # back to the historical 512 KB.
      BLUEFIN_SOCKET_RCVBUF:                "8388608"   # 8 MiB
      BLUEFIN_SOCKET_SNDBUF:                "8388608"   # 8 MiB
    steps:
      - uses: actions/checkout@v4
      - name: Install Rust
        run: rustup update stable
      - name: Cache cargo
        uses: Swatinem/rust-cache@v2
      - name: Build release binaries
        run: cargo build --release --bin server --bin client
      - name: Run CI bench (5 runs x 2 conns)
        id: bench
        # Don't fail the step here — we want the comment + step-summary to
        # post even on regression. We re-export the rc and fail at the end.
        run: |
          set +e
          ./bench_ci.sh -r 5 -n 2 --skip-build
          echo "rc=$?" >> "$GITHUB_OUTPUT"
      - name: Append summary to GitHub step summary
        if: always()
        run: |
          if [[ -s "$BLUEFIN_BENCH_SUMMARY_MD" ]]; then
            cat "$BLUEFIN_BENCH_SUMMARY_MD" >> "$GITHUB_STEP_SUMMARY"
          else
            echo "## Bluefin throughput bench :warning: no summary produced" >> "$GITHUB_STEP_SUMMARY"
          fi
      - name: Post / update PR comment
        if: always() && github.event_name == 'pull_request'
        uses: marocchino/sticky-pull-request-comment@v2
        with:
          # `header` keys the sticky comment so subsequent runs UPDATE the
          # same comment instead of spamming the PR.
          header: bluefin-bench
          path: ${{ env.BLUEFIN_BENCH_SUMMARY_MD }}
      - name: Upload bench logs
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: bench-logs
          path: bench_logs/
          retention-days: 14
      - name: Fail job on regression
        if: always()
        run: |
          rc="${{ steps.bench.outputs.rc }}"
          echo "bench_ci.sh exit code: $rc"
          exit "${rc:-1}"
