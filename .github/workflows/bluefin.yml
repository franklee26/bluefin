name: Bluefin

on:
  push:
    branches: [ "main" ]
  pull_request:
    branches: [ "main" ]

env:
  CARGO_TERM_COLOR: always

jobs:
  build:
    runs-on: ${{ matrix.os }}
    strategy:
      matrix:
        os: [ ubuntu-latest, macos-latest ]
        include:
          - os: ubuntu-latest
            target: Linux

          - os: macos-latest
            target: Macos

    steps:
      - uses: actions/checkout@v3
      - name: Build
        run: cargo build --verbose
      - name: Run tests
        run: cargo test --verbose
      - name: Build w/ macos-fast
        if: runner.os == 'macOS'
        run: cargo build --verbose --features macos-fast
      - name: Run test w/ macos-fast
        if: runner.os == 'macOS'
        run: cargo test --verbose --features macos-fast

  coverage:
    runs-on: ubuntu-latest
    env:
      CARGO_TERM_COLOR: always
    steps:
      - uses: actions/checkout@v4
      - name: Install Rust
        run: rustup update stable
      - name: Install cargo-llvm-cov
        uses: taiki-e/install-action@cargo-llvm-cov
      - name: Generate code coverage
        run: cargo llvm-cov --all-features --workspace --lcov --ignore-filename-regex "error.rs" --output-path lcov.info
      - name: Upload coverage to Codecov
        uses: codecov/codecov-action@v3
        with:
          token: ${{ secrets.CODECOV_TOKEN }} # not required for public repos
          files: lcov.info
          fail_ci_if_error: false

  kani:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
    steps:
      - name: Checkout bluefin
        uses: actions/checkout@v4
      - name: Run Kani
        uses: model-checking/kani-github-action@v1.1

  bench-macos:
    # Throughput regression gate. Runs the two-process loopback bench
    # (server + N client procs, each with its own tokio runtime) 5 times
    # at N=2 connections, parses per-conn FINAL lines, and asserts the
    # aggregate stats clear the floors below.
    #
    # >>> RUNNER REALITY <<<
    # Hosted macos-latest runners are dramatically slower and burstier than
    # typical Apple-silicon dev hardware. Empirically (2026-05-11 CI run):
    #   - max peak gb/s tracks within ~5 % of dev (3.65 vs 3.85 local)
    #   - mean avg gb/s is ~5 % of dev (0.10 vs 1.82 local)
    #   - bilateral failure is the steady state: one conn per run makes
    #     real progress (300–800 MB), the other stalls at <60 MB before
    #     the server's 2 s recv-idle timeout fires
    # That makes **max_peak the primary regression signal**. mean_avg is a
    # noise floor (just non-zero). good_conns has been rebaselined for CI:
    # the threshold for "good" is now 100 MB delivered (vs 14 GB locally),
    # so it gates "at least N conns somewhere made real progress" rather
    # than "at least N conns completed the full payload".
    #
    # Current floors are pegged at ~50 % of the OBSERVED CI MEDIAN, NOT
    # local dev. If CI flakes:
    #   - lower BLUEFIN_BENCH_FLOOR_MAX_PEAK_GBPS in 0.20 steps;
    #   - if mean_avg trips, you have a real regression — investigate
    #     before lowering it further;
    #   - if good_conns trips, check whether BOTH conns starved across
    #     multiple runs (real regression) or whether the 100 MB threshold
    #     is now wrong for the runner generation.
    #
    # >>> RATCHET INSTRUCTIONS <<<
    # After 5–10 successful CI runs, raise floors based on the OBSERVED CI
    # numbers (not local dev):
    #   1. Open the most recent green `bench-macos` run logs.
    #   2. Compute the median of "max peak gb/s" across runs.
    #   3. Set BLUEFIN_BENCH_FLOOR_MAX_PEAK_GBPS to ~0.50 * that median.
    #   4. Leave mean_avg at 0.05 unless the CI median has demonstrably
    #      risen.
    #   5. For good_conns: count how many conn-trials cleared the 100 MB
    #      threshold across the recent runs, take the median of "good per
    #      run", multiply by N_RUNS, then drop one for headroom.
    runs-on: macos-latest
    # `pull-requests: write` is required so the sticky-comment step can
    # post / update the bench-results comment on the PR. `contents: read`
    # is the implicit default for `actions/checkout`.
    permissions:
      contents: read
      pull-requests: write
    env:
      # Pegged at ~50 % of the observed CI median, NOT local dev. See block
      # comment above for the rationale.
      BLUEFIN_BENCH_FLOOR_MEAN_AVG_GBPS:    "0.05"      # noise floor (just non-zero)
      BLUEFIN_BENCH_FLOOR_MAX_PEAK_GBPS:    "1.00"      # ~50 % of CI-median peak (~2.40)
      BLUEFIN_BENCH_FLOOR_GOOD_CONNS:       "4"         # ≥4 of 10 conn-trials made real progress; observed 5, 1-trial headroom
      BLUEFIN_BENCH_GOOD_CONN_MIN_BYTES:    "100000000" # 100 MB: separates "made real progress" from "starved" on hosted runners
      BLUEFIN_BENCH_SUMMARY_MD:             "bench_logs/ci_summary.md"
    steps:
      - uses: actions/checkout@v4
      - name: Install Rust
        run: rustup update stable
      - name: Cache cargo
        uses: Swatinem/rust-cache@v2
      - name: Build release binaries
        run: cargo build --release --bin server --bin client
      - name: Run CI bench (5 runs x 2 conns)
        id: bench
        # Don't fail the step here — we want the comment + step-summary to
        # post even on regression. We re-export the rc and fail at the end.
        run: |
          set +e
          ./bench_ci.sh -r 5 -n 2 --skip-build
          echo "rc=$?" >> "$GITHUB_OUTPUT"
      - name: Append summary to GitHub step summary
        if: always()
        run: |
          if [[ -s "$BLUEFIN_BENCH_SUMMARY_MD" ]]; then
            cat "$BLUEFIN_BENCH_SUMMARY_MD" >> "$GITHUB_STEP_SUMMARY"
          else
            echo "## Bluefin throughput bench :warning: no summary produced" >> "$GITHUB_STEP_SUMMARY"
          fi
      - name: Post / update PR comment
        if: always() && github.event_name == 'pull_request'
        uses: marocchino/sticky-pull-request-comment@v2
        with:
          # `header` keys the sticky comment so subsequent runs UPDATE the
          # same comment instead of spamming the PR.
          header: bluefin-bench
          path: ${{ env.BLUEFIN_BENCH_SUMMARY_MD }}
      - name: Upload bench logs
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: bench-logs
          path: bench_logs/
          retention-days: 14
      - name: Fail job on regression
        if: always()
        run: |
          rc="${{ steps.bench.outputs.rc }}"
          echo "bench_ci.sh exit code: $rc"
          exit "${rc:-1}"
