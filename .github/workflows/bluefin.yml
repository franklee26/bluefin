name: Bluefin

on:
  push:
    branches: [ "main" ]
  pull_request:
    branches: [ "main" ]

env:
  CARGO_TERM_COLOR: always

jobs:
  build:
    runs-on: ${{ matrix.os }}
    strategy:
      matrix:
        os: [ ubuntu-latest, macos-latest ]
        include:
          - os: ubuntu-latest
            target: Linux

          - os: macos-latest
            target: Macos

    steps:
      - uses: actions/checkout@v3
      - name: Build
        run: cargo build --verbose
      - name: Run tests
        run: cargo test --verbose
      - name: Build w/ macos-fast
        if: runner.os == 'macOS'
        run: cargo build --verbose --features macos-fast
      - name: Run test w/ macos-fast
        if: runner.os == 'macOS'
        run: cargo test --verbose --features macos-fast

  coverage:
    runs-on: ubuntu-latest
    env:
      CARGO_TERM_COLOR: always
    steps:
      - uses: actions/checkout@v4
      - name: Install Rust
        run: rustup update stable
      - name: Install cargo-llvm-cov
        uses: taiki-e/install-action@cargo-llvm-cov
      - name: Generate code coverage
        run: cargo llvm-cov --all-features --workspace --lcov --ignore-filename-regex "error.rs" --output-path lcov.info
      - name: Upload coverage to Codecov
        uses: codecov/codecov-action@v3
        with:
          token: ${{ secrets.CODECOV_TOKEN }} # not required for public repos
          files: lcov.info
          fail_ci_if_error: false

  kani:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
    steps:
      - name: Checkout bluefin
        uses: actions/checkout@v4
      - name: Run Kani
        uses: model-checking/kani-github-action@v1.1

  bench:
    # Throughput regression gate. Runs the two-process loopback bench
    # (server + N client procs, each with its own tokio runtime) 5 times
    # at N=2 connections, parses per-conn FINAL lines, and asserts the
    # aggregate stats clear the floors below.
    #
    # Current floors are pegged at ~75% of the local 20-run sweep median
    # (mean avg 1.82 GB/s, max peak 3.85 GB/s, 90% good-conn rate). Hosted
    # macos-latest runners are slower and noisier than dev hardware, so if
    # CI flakes here:
    #   - first try widening `BLUEFIN_BENCH_GOOD_CONN_MIN_BYTES` (default
    #     14e9) to count more partial deliveries as "good";
    #   - then dial back the gb/s floors in 0.10 steps;
    #   - last resort, lower BLUEFIN_BENCH_FLOOR_GOOD_CONNS to 7.
    #
    # >>> RATCHET INSTRUCTIONS <<<
    # After 5–10 successful CI runs on macos-latest, raise the floors to
    # ~75% of the observed CI median to lock in any perf gains:
    #   1. Open the most recent green `bench` run logs.
    #   2. Note the "mean avg gb/s" and "max peak gb/s" lines.
    #   3. Set the env vars below to ~0.75 * observed median.
    #   4. Set BLUEFIN_BENCH_FLOOR_GOOD_CONNS to ~75% of total trials,
    #      rounded UP (10 trials → 8).
    runs-on: macos-latest
    # `pull-requests: write` is required so the sticky-comment step can
    # post / update the bench-results comment on the PR. `contents: read`
    # is the implicit default for `actions/checkout`.
    permissions:
      contents: read
      pull-requests: write
    env:
      # Pegged at ~75% of the local 20-run sweep median. See block comment above.
      BLUEFIN_BENCH_FLOOR_MEAN_AVG_GBPS: "1.35"   # 75% of 1.82 GB/s local median
      BLUEFIN_BENCH_FLOOR_MAX_PEAK_GBPS: "2.85"   # 75% of 3.85 GB/s local median
      BLUEFIN_BENCH_FLOOR_GOOD_CONNS:    "8"      # 75% of 5 runs * 2 conns = 10
      BLUEFIN_BENCH_SUMMARY_MD:          "bench_logs/ci_summary.md"
    steps:
      - uses: actions/checkout@v4
      - name: Install Rust
        run: rustup update stable
      - name: Cache cargo
        uses: Swatinem/rust-cache@v2
      - name: Build release binaries
        run: cargo build --release --bin server --bin client
      - name: Run CI bench (5 runs x 2 conns)
        id: bench
        # Don't fail the step here — we want the comment + step-summary to
        # post even on regression. We re-export the rc and fail at the end.
        run: |
          set +e
          ./bench_ci.sh -r 5 -n 2 --skip-build
          echo "rc=$?" >> "$GITHUB_OUTPUT"
      - name: Append summary to GitHub step summary
        if: always()
        run: |
          if [[ -s "$BLUEFIN_BENCH_SUMMARY_MD" ]]; then
            cat "$BLUEFIN_BENCH_SUMMARY_MD" >> "$GITHUB_STEP_SUMMARY"
          else
            echo "## Bluefin throughput bench :warning: no summary produced" >> "$GITHUB_STEP_SUMMARY"
          fi
      - name: Post / update PR comment
        if: always() && github.event_name == 'pull_request'
        uses: marocchino/sticky-pull-request-comment@v2
        with:
          # `header` keys the sticky comment so subsequent runs UPDATE the
          # same comment instead of spamming the PR.
          header: bluefin-bench
          path: ${{ env.BLUEFIN_BENCH_SUMMARY_MD }}
      - name: Upload bench logs
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: bench-logs
          path: bench_logs/
          retention-days: 14
      - name: Fail job on regression
        if: always()
        run: |
          rc="${{ steps.bench.outputs.rc }}"
          echo "bench_ci.sh exit code: $rc"
          exit "${rc:-1}"
